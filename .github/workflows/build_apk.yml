name: Build Flutter APK

on:
  push:
    branches: [ "main", "version-offline" ]  # Se activará cuando subas cambios a estas ramas
  pull_request:
    branches: [ "main", "version-offline" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (Requerido para Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'  # O la versión de Flutter que estés utilizando
          channel: 'stable'
          cache: true

      - name: Instalar dependencias del Frontend
        run: |
          cd caa_frontend
          flutter pub get

      - name: Compilar APK de Android (Release)
        run: |
          cd caa_frontend
          flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: caa_frontend/build/app/outputs/flutter-apk/app-release.apk